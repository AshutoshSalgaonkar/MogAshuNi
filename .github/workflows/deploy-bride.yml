name: Deploy bride invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bride-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:bride
      - name: Publish to the account root
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.BRIDE_PAGES_TOKEN }}
          external_repository: AshutoshSalgaonkar/ashutoshsalgaonkar.github.io
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
